name: 125A OB-12 VST3 Windows integration tests
on:
  push:
    branches: [feature/preset-browser-audit, audit/p007-adversarial-20261118]
  workflow_dispatch:
jobs:
  compile:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: v3.7.12_build_20
          path: vendor/vst3sdk
          submodules: recursive
      - name: Compile changed source files without ROM
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist build mkdir build
          clang-cl /nologo /EHsc /std:c++17 /D_CRT_SECURE_NO_WARNINGS /Isrc /Isrc\shim /Isrc\f2mc16 /Ivendor\vst3sdk /FIemu.h /c src\ob12_engine.cpp /Fobuild\source-check-engine.obj
          if errorlevel 1 exit /b 1
          clang-cl /nologo /EHsc /std:c++17 /D_CRT_SECURE_NO_WARNINGS /Isrc /c src\panel_view.cpp /Fobuild\source-check-panel.obj
          if errorlevel 1 exit /b 1
          clang-cl /nologo /EHsc /std:c++17 /D_CRT_SECURE_NO_WARNINGS /Isrc /Ivendor\vst3sdk /c src\ob12_vst3.cpp /Fobuild\source-check-vst3.obj
          if errorlevel 1 exit /b 1
      - name: P007 bounded realtime MIDI FIFO and deliberate timing-mutation counterexample
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          clang-cl /nologo /O2 /EHsc /std:c++17 /Isrc tools\test_midi_rt_queue.cpp /Fe:build\test_midi_rt_queue.exe
          if errorlevel 1 exit /b 1
          build\test_midi_rt_queue.exe
          if errorlevel 1 exit /b 1
          clang-cl /nologo /O2 /EHsc /std:c++17 /DP007_TEST_TIMING_MUTANT /Isrc tools\test_midi_rt_queue.cpp /Fe:build\test_midi_rt_mutant.exe
          if errorlevel 1 exit /b 1
          build\test_midi_rt_mutant.exe > build\p007-mutant.log
          if not errorlevel 7 exit /b 1
          findstr /C:"P007_MIDI_QUEUE_FAIL=exact 48-kHz event boundary" build\p007-mutant.log >nul
          if errorlevel 1 exit /b 1
          clang-cl /nologo /O2 /EHsc /std:c++17 /DP007_TEST_EARLY_RECOVERY_MUTANT /Isrc tools\test_midi_rt_queue.cpp /Fe:build\test_midi_rt_early_recovery_mutant.exe
          if errorlevel 1 exit /b 1
          build\test_midi_rt_early_recovery_mutant.exe > build\p007-early-recovery-mutant.log
          if not errorlevel 14 exit /b 1
          findstr /C:"P007_MIDI_QUEUE_FAIL=recovery cannot overtake accepted notes" build\p007-early-recovery-mutant.log >nul
          if errorlevel 1 exit /b 1
          clang-cl /nologo /O2 /EHsc /std:c++17 /DP007_TEST_PREMATURE_RECOVERY_RELEASE_MUTANT /Isrc tools\test_midi_rt_queue.cpp /Fe:build\test_midi_rt_premature_release_mutant.exe
          if errorlevel 1 exit /b 1
          build\test_midi_rt_premature_release_mutant.exe > build\p007-premature-release-mutant.log
          if not errorlevel 20 exit /b 1
          findstr /C:"P007_MIDI_QUEUE_FAIL=panic must fence new notes until after CC120/123 delivered" build\p007-premature-release-mutant.log >nul
          if errorlevel 1 exit /b 1
      - name: Link real Windows VST3 library (without firmware)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          clang-cl /nologo /EHsc /std:c++17 /D_CRT_SECURE_NO_WARNINGS /Isrc /Isrc\shim /Isrc\f2mc16 /Ibuild /FIemu.h /c src\f2mc16\f2mc16.cpp /Fobuild\f2mc16.obj
          if errorlevel 1 exit /b 1
          clang-cl /nologo /EHsc /std:c++17 /D_CRT_SECURE_NO_WARNINGS /Isrc /Isrc\shim /Isrc\f2mc16 /Ibuild /FIemu.h /c src\tms57070\tms57070.cpp /Fobuild\tms57070.obj
          if errorlevel 1 exit /b 1
          clang-cl /nologo /EHsc /std:c++17 /Ivendor\vst3sdk /c vendor\vst3sdk\pluginterfaces\base\coreiids.cpp /Fobuild\coreiids.obj
          if errorlevel 1 exit /b 1
          clang-cl /nologo /EHsc /std:c++17 /Ivendor\vst3sdk /c vendor\vst3sdk\pluginterfaces\base\funknown.cpp /Fobuild\funknown.obj
          if errorlevel 1 exit /b 1
          clang-cl /nologo /EHsc /std:c++17 /Ivendor\vst3sdk /c vendor\vst3sdk\public.sdk\source\vst\vstinitiids.cpp /Fobuild\vstinitiids.obj
          if errorlevel 1 exit /b 1
          clang-cl /nologo /EHsc /std:c++17 /Ivendor\vst3sdk /c tools\vst3_iids.cpp /Fobuild\vst3_iids.obj
          if errorlevel 1 exit /b 1
          if not exist build\OB12.vst3\Contents\x86_64-win mkdir build\OB12.vst3\Contents\x86_64-win
          clang-cl /nologo /LD build\source-check-vst3.obj build\source-check-panel.obj build\source-check-engine.obj build\f2mc16.obj build\tms57070.obj build\coreiids.obj build\funknown.obj build\vstinitiids.obj build\vst3_iids.obj synchronization.lib d2d1.lib dwrite.lib windowscodecs.lib gdi32.lib user32.lib ole32.lib comdlg32.lib winmm.lib /Fe:build\OB12.vst3\Contents\x86_64-win\OB12.vst3
          if errorlevel 1 exit /b 1
          if not exist build\OB12.vst3\Contents\x86_64-win\OB12.vst3 exit /b 1

      - name: Stage upstream original firmware for private integration validation
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/Tuth/ob12-emu/releases/download/v0.10.0/OB-12-v0.10-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile 'build/upstream-test.zip'
          Expand-Archive -LiteralPath 'build/upstream-test.zip' -DestinationPath 'build/upstream-test' -Force
          $cpu = Get-ChildItem 'build/upstream-test' -Recurse -File -Filter '12cpu152-CPU-v1.52-FINAL.bin' | Select-Object -First 1
          if (-not $cpu) { throw 'Original release firmware was not found' }
          $target = 'build/OB12.vst3/Contents/x86_64-win/rom'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path "$($cpu.Directory.FullName)\*" -Destination $target -Recurse -Force
          if (-not (Test-Path "$target/12dsp111-DSP-v1.11-FINAL.bin")) { throw 'Original DSP firmware was not found' }
          Write-Host "Firmware test resources loaded: $((Get-ChildItem $target -Recurse -File).Count) files. Temporary use only, not published."
      - name: Inspect factory-bank name-index validity
        shell: cmd
        run: |
          python tools\factory_name_probe.py build\OB12.vst3\Contents\x86_64-win\rom\presets\12prgFS.bin build\OB12.vst3\Contents\x86_64-win\rom\presets\12tmbFS.bin
          if errorlevel 1 exit /b 1
      - name: Generate transient playable alternate bank for browser regression
        shell: cmd
        run: |
          python tools\generate_bank_fixture.py build\OB12.vst3\Contents\x86_64-win\rom\presets build\bank-tests UI --ui-names --size-first
          if errorlevel 1 exit /b 1
      - name: Build translated DSP and link firmware-backed Windows VST3
        shell: cmd
        timeout-minutes: 8
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          python tools\ob12_carve.py build\OB12.vst3\Contents\x86_64-win\rom\12dsp111-DSP-v1.11-FINAL.bin -o build\OB12.vst3\Contents\x86_64-win\rom\dsp
          if errorlevel 1 exit /b 1
          python tools\gen_fast.py build\OB12.vst3\Contents\x86_64-win\rom\dsp build\tms_fast.inc
          if errorlevel 1 exit /b 1
          clang-cl /nologo /O2 /EHsc /std:c++17 /D_CRT_SECURE_NO_WARNINGS /Isrc /Isrc\shim /Isrc\f2mc16 /Ibuild /FIemu.h /c src\tms57070\tms57070.cpp /Fobuild\tms57070.obj
          if errorlevel 1 exit /b 1
          clang-cl /nologo /LD build\source-check-vst3.obj build\source-check-panel.obj build\source-check-engine.obj build\f2mc16.obj build\tms57070.obj build\coreiids.obj build\funknown.obj build\vstinitiids.obj build\vst3_iids.obj synchronization.lib d2d1.lib dwrite.lib windowscodecs.lib gdi32.lib user32.lib ole32.lib comdlg32.lib winmm.lib /Fe:build\OB12.vst3\Contents\x86_64-win\OB12.vst3
          if errorlevel 1 exit /b 1
      - name: Test real firmware-backed note, audio and editor lifecycle
        shell: cmd
        timeout-minutes: 4
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          clang-cl /nologo /EHsc /std:c++17 /Ivendor\vst3sdk tools\vst3_smoke.cpp build\coreiids.obj build\funknown.obj build\vstinitiids.obj ole32.lib user32.lib /Fe:build\vst3_smoke.exe
          if errorlevel 1 exit /b 1
          build\vst3_smoke.exe build\OB12.vst3\Contents\x86_64-win\OB12.vst3
          if errorlevel 1 exit /b 1
      - name: Verify VST3 factory and interfaces without firmware
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          clang-cl /nologo /EHsc /std:c++17 /Ivendor\vst3sdk tools\vst3_norom_smoke.cpp build\coreiids.obj build\funknown.obj build\vstinitiids.obj ole32.lib user32.lib /Fe:build\vst3_norom_smoke.exe
          if errorlevel 1 exit /b 1
          build\vst3_norom_smoke.exe build\OB12.vst3\Contents\x86_64-win\OB12.vst3
          if errorlevel 1 exit /b 1

      - name: Validate original Program and Timbre bank MIDI encoding
        shell: cmd
        run: |
          python tools\generate_bank_fixture.py build\OB12.vst3\Contents\x86_64-win\rom\presets build\bank-tests TT
          if errorlevel 1 exit /b 1
          python tools\generate_bank_fixture.py build\OB12.vst3\Contents\x86_64-win\rom\presets build\bank-tests VA2
          if errorlevel 1 exit /b 1
      - name: Validate direct Flash bank installation and original CPU note playback
        timeout-minutes: 16
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          clang-cl /nologo /O2 /EHsc /std:c++17 /Isrc tools\bank_import_smoke.cpp build\source-check-engine.obj build\f2mc16.obj build\tms57070.obj synchronization.lib winmm.lib user32.lib /Fe:build\bank_import_smoke.exe
          if errorlevel 1 exit /b 1
          build\bank_import_smoke.exe build\OB12.vst3\Contents\x86_64-win\rom build\bank-tests\12tmbTT.mid build\bank-tests\12prgTT.mid build\OB12.vst3\Contents\x86_64-win\rom\presets\12tmbFS.bin build\OB12.vst3\Contents\x86_64-win\rom\presets\12prgFS.bin direct
          if errorlevel 1 exit /b 1
          build\bank_import_smoke.exe build\OB12.vst3\Contents\x86_64-win\rom build\bank-tests\12tmbVA2.mid build\bank-tests\12prgVA2.mid build\OB12.vst3\Contents\x86_64-win\rom\presets\12tmbFS.bin build\OB12.vst3\Contents\x86_64-win\rom\presets\12prgFS.bin direct
          if errorlevel 1 exit /b 1
      - name: Adversarial P007 project-private factory reset must actually revert flash
        shell: cmd
        timeout-minutes: 5
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          clang-cl /nologo /O2 /EHsc /std:c++17 /Isrc tools\audit_p007_adversarial.cpp build\source-check-panel.obj build\source-check-engine.obj build\f2mc16.obj build\tms57070.obj synchronization.lib winmm.lib user32.lib gdi32.lib d2d1.lib dwrite.lib windowscodecs.lib ole32.lib comdlg32.lib /Fe:build\audit_p007_adversarial.exe
          if errorlevel 1 exit /b 1
          build\audit_p007_adversarial.exe build\OB12.vst3\Contents\x86_64-win\rom
          if errorlevel 1 exit /b 1
      - name: Package complete 125A Windows VST3 with original personal-use firmware and presets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'build/125A-OB12-VST3-FULL'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -LiteralPath 'build/OB12.vst3' -Destination "$root/OB12.vst3" -Recurse -Force
          # MSVC .lib/.exp linker products are not part of a VST3 installation.
          Remove-Item "$root/OB12.vst3/Contents/x86_64-win/OB12.lib" -ErrorAction SilentlyContinue
          Remove-Item "$root/OB12.vst3/Contents/x86_64-win/OB12.exp" -ErrorAction SilentlyContinue
          $bundle = "$root/OB12.vst3/Contents/x86_64-win"
          $rom = "$bundle/rom"
          foreach ($required in @(
            "$bundle/OB12.vst3",
            "$rom/12cpu152-CPU-v1.52-FINAL.bin",
            "$rom/12dsp111-DSP-v1.11-FINAL.bin",
            "$rom/presets/12prgFS.bin",
            "$rom/presets/12tmbFS.bin"
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required full-install file missing: $required"
            }
          }
          $dsp = @(Get-ChildItem "$rom/dsp" -File -ErrorAction Stop)
          if ($dsp.Count -lt 1) { throw "DSP program directory is empty" }
          $files = @(Get-ChildItem "$bundle" -Recurse -File)
          if ($files.Count -lt 10) {
            throw "Full package unexpectedly sparse: $($files.Count) files"
          }
          Write-Host "P007_FULL_PACKAGE=PASS files=$($files.Count) dsp_programs=$($dsp.Count)"
          Write-Host "P007_FULL_PACKAGE_BANKS:"
          Get-ChildItem "$rom/presets" -File | Select-Object -ExpandProperty Name | Sort-Object
          Copy-Item LICENSE "$root/LICENSE-GPL-3.0.txt" -Force
          @'
          125A OB-12 VST3 — Complete Windows x64 installation for personal use
          Tested source provenance: see SOURCE-AND-BUILD.txt (exact run SHA)
          Original synthesizer firmware/data copyright Viscount International.
          Firmware comes from the upstream Tuth/ob12-emu v0.10.0 release for
          personal/archival use. No commercial redistribution authorized here.
          The emulator code derives from Tuth/ob12-emu under GPL-3.0.

          INSTALLATION:
          1. Close Studio One.
          2. Back up your existing OB12.vst3 folder if installed.
          3. Extract the enclosed OB12.vst3 folder as one directory to:
             C:\Program Files\Common Files\VST3\OB12.vst3
          4. Keep Contents\x86_64-win\rom and all its contents intact.
          5. Start Studio One, rescan plugins, load 125A OB-12 VST3.
          6. Right-click the original blue OB-12 panel to access Preset Browser.

          Included: tested 125A OB12.vst3 binary, original CPU/DSP firmware,
          original factory program/timbre resources, DSP programs, licensing.
          Additional third-party/user banks depend on their actual availability
          in the upstream original release. Do not assume they are bundled.
          Studio One practical acceptance remains unverified.

          Source code: https://github.com/challanger2000/125A-OB12-VST3
          Base project: https://github.com/Tuth/ob12-emu
          '@ | Set-Content "$root/INSTALL-125A.txt" -Encoding utf8
          @'
          125A modified VST3 plugin source:
          https://github.com/challanger2000/125A-OB12-VST3

          Upstream original:
          https://github.com/Tuth/ob12-emu/tree/v0.10.0

          Build and original firmware verification:
          Windows CI run: exact URL appended below
          '@ | Set-Content "$root/SOURCE-AND-BUILD.txt" -Encoding utf8
          # Never pin a previous binary/test's SHA in a new full artifact.
          Add-Content "$root/INSTALL-125A.txt" "Exact source SHA: $env:GITHUB_SHA" -Encoding utf8
          Add-Content "$root/SOURCE-AND-BUILD.txt" "Exact source SHA: $env:GITHUB_SHA" -Encoding utf8
          Add-Content "$root/SOURCE-AND-BUILD.txt" "CI: https://github.com/challanger2000/125A-OB12-VST3/actions/runs/$env:GITHUB_RUN_ID" -Encoding utf8
          $all = @(Get-ChildItem $root -Recurse -File)
          Write-Host "P007_FULL_INSTALL_READY=PASS bundle_files=$($all.Count) total_bytes=$(($all | Measure-Object Length -Sum).Sum)"
      - name: Publish complete Windows VST3 for personal evaluation
        uses: actions/upload-artifact@v4
        with:
          name: 125A-OB12-VST3-FULL-win64
          path: build/125A-OB12-VST3-FULL/*
          retention-days: 14
          if-no-files-found: error
